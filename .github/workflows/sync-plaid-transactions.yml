name: Sync Plaid Transactions

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync-plaid:
    runs-on: ubuntu-latest

    steps:
      - name: Send request to sync stale Plaid transactions
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set"; exit 1
          fi
          status=$(curl -sS -o /tmp/response.json -w "%{http_code}" -X POST \
            --connect-timeout 15 \
            --max-time 90 \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 5 \
            https://www.moneyeye.dev/api/cronjob/sync-plaid-transactions \
            -H "Authorization: Bearer $CRON_SECRET")
          cat /tmp/response.json
          echo
          if [ "$status" -ne 200 ]; then exit 1; fi
